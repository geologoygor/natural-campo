<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#113E6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campo Natural">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap"><!-- fonte do carimbo; o service worker guarda para usar sem internet -->
<link rel="icon" href="icon-192.png">
<title>Campo · Natural Engenharia</title>
<style>
:root{
  --navy:#113E6B; --navy-2:#0C2F52; --green:#19A878; --green-2:#137F5B;
  --ink:#1B2430; --muted:#5B6570; --line:#D9DEE5; --bg:#F3F5F8; --card:#FFFFFF;
  --warn:#B45309; --warn-bg:#FEF3C7; --err:#B91C1C; --err-bg:#FEE2E2; --ok-bg:#DCFCE7;
  --r:14px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100%}
/* a rolagem acontece dentro do <main>: assim a barra da fila fica SEMPRE no rodapé, inclusive no iPhone */
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--navy);color:#fff;font-weight:600}
button.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
button.green{background:var(--green)}
button.ghost{background:transparent;color:var(--navy);padding:8px 10px}
button.danger{background:var(--err)}
button:disabled{opacity:.45;cursor:default}
button.big{width:100%;padding:16px;font-size:17px}
input,select,textarea{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:90px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
header{background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{height:26px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .t small{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.14);padding:8px 12px;font-size:13px}
main{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 16px 16px;width:100%;margin:0 auto}
main>*{max-width:720px;margin-left:auto;margin-right:auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(17,62,107,.06)}
.card h2{margin:0 0 8px;font-size:17px;color:var(--navy)}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--green-2);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted);font-size:14px}
.chip{display:inline-block;background:#E8F1FA;color:var(--navy);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.chip.g{background:var(--ok-bg);color:var(--green-2)}
.chip.w{background:var(--warn-bg);color:var(--warn)}
.chip.e{background:var(--err-bg);color:var(--err)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.obra{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);padding:14px;margin-bottom:10px;border-radius:var(--r);font-weight:500}
.obra b{display:block;color:var(--navy);font-size:16px;margin-bottom:3px}
.obra small{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:-14px;background:var(--bg);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:#fff;color:var(--navy);border:1.5px solid var(--line);padding:9px 14px;font-size:14px;border-radius:999px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{background:#fff;border:1.5px dashed var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--ink);font-weight:500;min-height:150px;display:flex;flex-direction:column;gap:6px;position:relative}
.slot.done{border-style:solid;border-color:var(--green)}
.slot .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.slot.done .n{background:var(--green)}
.slot b{font-size:14px}
.slot small{color:var(--muted);font-size:12px;line-height:1.3}
.slot img{width:100%;height:80px;object-fit:cover;border-radius:8px;margin-top:auto}
.slot .cnt{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk:last-child{border-bottom:0}
.chk input{width:24px;height:24px;flex:0 0 auto;margin:0;accent-color:var(--green)}
details{border-top:1px solid var(--line);padding:8px 0}
details summary{cursor:pointer;font-weight:600;color:var(--navy);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details summary::after{content:"+";font-size:20px;color:var(--green)}
details[open]>summary::after{content:"–"}
.etapa{padding:8px 0 8px 14px;border-left:3px solid var(--green);margin:8px 0;font-size:15px}
.etapa .pq{color:var(--muted);font-size:13px;margin-top:4px}
.regra{padding:6px 0 6px 12px;border-left:3px solid var(--navy);margin:6px 0;font-size:14px}
.erro{background:#FFF7ED;border-radius:10px;padding:10px;margin:6px 0;font-size:14px}
.erro b{color:var(--warn)}
.auto{display:grid;grid-template-columns:1fr;gap:8px}
.auto div{border-radius:10px;padding:10px;font-size:14px}
.auto .s{background:var(--ok-bg)} .auto .a{background:var(--warn-bg)} .auto .p{background:var(--err-bg)}
.fila{flex:none;background:#fff;border-top:1.5px solid var(--line);padding:10px 16px calc(10px + var(--sab));display:flex;align-items:center;gap:10px;z-index:20}
.fila .s{flex:1;font-size:14px}
.fila .s b{color:var(--navy)}
.fila button{padding:10px 14px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.th{position:relative;border-radius:10px;overflow:hidden;background:#E8ECF1;aspect-ratio:1}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .st{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:3px 6px;background:rgba(17,62,107,.85);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.sent .st{background:rgba(25,168,120,.9)}
.th.err .st{background:rgba(185,28,28,.9)}
.th .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:26px;height:26px;padding:0;font-size:16px;line-height:26px;text-align:center}
.th .au{display:flex;align-items:center;justify-content:center;height:100%;font-size:34px}
.banner{background:var(--err-bg);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.nota{color:var(--muted);font-size:13px;margin:6px 0}
.instalar{background:var(--navy);color:#fff}.instalar h2{color:#fff}.instalar .passos{font-size:14px;line-height:1.6;margin-top:6px}.instalar button{background:#fff;color:var(--navy);margin-top:8px}
.geo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:#E8F1FA;border-radius:8px;padding:8px 10px;color:var(--navy)}
.seg{display:flex;border:1.5px solid var(--navy);border-radius:10px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:#fff;color:var(--navy);padding:10px}
.seg button.on{background:var(--navy);color:#fff}
/* tela inicial (v1.13): Hoje · Tarefas · Obras, cor por urgência */
.desemp-n{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.02em}
.desemp-bar{height:10px;border-radius:6px;background:#E8ECF1;overflow:hidden;margin:10px 0 4px}.desemp-bar i{display:block;height:100%;border-radius:6px}
.eixo{border-top:1px solid var(--line);padding:10px 0}.eixo:first-of-type{border-top:0}
.eixo .eh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.eixo .eb{height:6px;border-radius:4px;background:#E8ECF1;overflow:hidden;margin:6px 0}.eixo .eb i{display:block;height:100%;background:var(--green)}
.como{background:#F1F6FB;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{flex:0 0 auto;background:#fff;color:var(--navy);border:1.5px solid var(--line);padding:8px 12px;font-size:14px;border-radius:999px}.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.item-av{border-top:1px solid var(--line);padding:9px 0}.item-av .ih{display:flex;gap:8px;align-items:center}.item-av .pct{flex:none;font-weight:800;min-width:70px;text-align:right}.item-av .pct.mudou{color:var(--green-2)}
.item-av .ctl{display:flex;gap:6px;margin-top:8px}.item-av .ctl button{flex:1;padding:9px 4px;font-size:14px}
.ini-nav{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:-14px;z-index:10;background:var(--bg);padding:6px 0}
.ini-nav button{flex:1;background:#fff;color:var(--navy);border:1.5px solid var(--line);padding:12px 6px;font-size:15px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.ini-nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bolha{font-style:normal;font-size:12px;font-weight:700;min-width:22px;padding:2px 7px;border-radius:999px;background:#E8F1FA;color:var(--navy)}
.ini-nav button.on .bolha{background:rgba(255,255,255,.2);color:#fff}
.bolha.e{background:var(--err);color:#fff}.bolha.w{background:#F59E0B;color:#fff}.bolha.n{background:var(--navy);color:#fff}.bolha.cinza{background:#94A3B8;color:#fff}
.hoje-cab{margin:2px 2px 10px}.hoje-data{font-size:22px;font-weight:800;color:var(--navy)}
.placar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.placar .pl{display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-radius:14px;border:0;font-weight:600}
.placar .pl b{font-size:30px;line-height:1}.placar .pl span{font-size:13px;margin-top:4px}
.pl.e{background:var(--err-bg);color:var(--err)}.pl.w{background:var(--warn-bg);color:var(--warn)}.pl.n{background:#E8F1FA;color:var(--navy)}
.vazio{color:var(--muted);font-size:15px;padding:6px 0}.vazio.ok{color:var(--green-2);font-weight:600}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.ev:last-child{border-bottom:0}
.ev-h{flex:0 0 64px;text-align:center;font-size:18px;font-weight:800;color:var(--navy);background:#E8F1FA;border-radius:10px;padding:8px 2px;align-self:flex-start}
.ev-h small{display:block;font-size:11px;font-weight:600;margin-top:2px}
.ev.campo .ev-h{background:var(--ok-bg);color:var(--green-2)}
.ev-c{flex:1;min-width:0}.ev-c b{display:block;font-size:15px}.ev-l{font-size:13px;color:var(--muted);margin-top:2px}
.dia-cab{margin:12px 0 2px;font-weight:700;color:var(--navy)}
.curta{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.curta:last-child{border-bottom:0}
.curta small{color:var(--muted)}
.dpill{flex:0 0 auto;background:var(--navy);color:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;min-width:70px;text-align:center}
details.tar{border:0;border-left:5px solid #93C5FD;background:#F8FAFC;border-radius:10px;padding:10px 12px;margin:8px 0}
details.tar.e{border-left-color:var(--err);background:#FFF5F5}details.tar.w{border-left-color:#F59E0B;background:#FFFBEB}details.tar.cinza{border-left-color:#CBD5E1;background:#F8FAFC}
details.tar summary::after{color:var(--muted)}
.tar-c{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tar-q{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--navy)}
.tar.e .tar-q{color:var(--err)}.tar.w .tar-q{color:var(--warn)}.tar.cinza .tar-q{color:var(--muted)}
.tar-t{font-size:15px;color:var(--ink);font-weight:600}.tar-o{font-size:13px;color:var(--muted);font-weight:500}
details.grupo{padding:12px 14px}details.grupo>summary{font-size:17px;color:var(--navy)}details.grupo>summary span{flex:1}
details.grupo>summary::after{margin-left:8px}
details.grupo.e>summary{color:var(--err)}details.grupo.w>summary{color:var(--warn)}details.grupo.cinza>summary{color:var(--muted)}
details.card{border-top:0}details.empresa>summary{color:var(--navy)}
details.instalar>summary{color:#fff}details.instalar>summary::after{color:#fff}
button.mini{padding:8px 12px;font-size:14px;margin-top:6px}
/* câmera */
#cam{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
#verPdf{position:fixed;inset:0;z-index:60;background:#3a3f47;display:flex;flex-direction:column}
#verPdf .vtop{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 10px 8px;background:var(--navy);color:#fff}
#verPdf .vtop b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#verPdf .vtop button{color:#fff;min-height:40px;padding:6px 12px;font-size:16px}
#verPdf .vcorpo{flex:1 1 0;min-height:0;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
#verPdf .vcorpo img{display:block;margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);max-width:none}
#verPdf .vbot{display:flex;gap:8px;padding:10px 10px calc(10px + var(--sab));background:#fff}
#verPdf .vbot button{flex:1;min-height:50px}
#cam.on{display:flex}
#cam video{flex:1 1 0;min-height:0;width:100%;object-fit:cover;background:#000}
#cam .bot{flex:none;position:relative;z-index:2}
#cam .top{position:absolute;top:0;left:0;right:0;padding:calc(10px + var(--sat)) 12px 10px;display:flex;gap:8px;align-items:center;background:linear-gradient(rgba(0,0,0,.6),transparent);color:#fff;font-size:13px}
#cam .top select{width:auto;flex:1;background:rgba(255,255,255,.15);color:#fff;border:0;padding:8px}
#cam .top select option{color:#000}
#cam #camGaleria{position:absolute;left:8px;bottom:calc(272px + var(--sab));color:#fff;background:rgba(0,0,0,.5);font-size:12px;border-radius:10px;z-index:3}
#cam #camLogo{position:absolute;left:12px;top:calc(62px + var(--sat));width:52px;height:52px;border-radius:10px;opacity:.92;box-shadow:0 2px 8px rgba(0,0,0,.45);z-index:2}
#cam.semmarca #camLogo{display:none}
#cam .tiras{position:absolute;left:0;right:0;bottom:calc(210px + var(--sab));display:flex;gap:8px;align-items:center;padding:0 12px;overflow-x:auto;z-index:3}
#cam .tiras .tt{flex:0 0 auto;width:62px;height:62px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.85);background:#222}
#cam .tiras .tt img{width:100%;height:100%;object-fit:cover;display:block}
#cam .tiras .cnt{flex:0 0 auto;color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:999px}
#camVer{position:absolute;inset:0;background:#000;z-index:8;display:flex;flex-direction:column}
#camVer.hide{display:none}
#camVer img{flex:1 1 0;min-height:0;width:100%;object-fit:contain;background:#000}
#camVer #camVerInfo{color:#bbb;font:12px ui-monospace,Menlo,monospace;text-align:center;padding:6px 8px;background:#111}
#camVer .cvbot{display:flex;gap:10px;padding:12px 14px calc(14px + var(--sab));background:#111}
#camVer .cvbot button{flex:1;min-height:50px}
#cam .geo2{position:absolute;left:12px;right:12px;bottom:calc(170px + var(--sab));pointer-events:none;color:#fff;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:rgba(17,62,107,.7);padding:6px 10px;border-radius:8px}
#cam .bot{padding:14px 20px calc(18px + var(--sab));display:flex;align-items:center;justify-content:space-between;background:#000;color:#fff}
#cam .shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid var(--green);padding:0}
#cam .mid{display:flex;flex-direction:column;align-items:center;gap:8px}
#cam .modo{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:3px}
#cam .modo button{background:none;border:0;color:#fff;font-size:13px;padding:5px 14px;border-radius:16px;min-height:0}
#cam .modo button.on{background:#fff;color:#000;font-weight:700}
#cam.video .shutter{background:#d93025;border-color:#fff}
#cam.gravando .shutter{border-radius:18px;background:#d93025;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.6}}
#cam .recT{font:600 13px ui-monospace,Menlo,monospace;color:#fff;min-height:16px}
#cam.gravando .recT{color:#ff6b5e}
#cam .bot button.ghost{color:#fff;font-size:13px}
#cam .tg{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#fff}
#cam .tg .sw{width:44px;height:24px;border-radius:999px;background:#555;position:relative;padding:0}
#cam .tg .sw.on{background:var(--green)}
#cam .tg .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
#cam .tg .sw.on::after{left:23px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60;transition:opacity .15s}
.desfazer-bar,#desfazer{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--sab));z-index:71;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#desfazer span{flex:1}
#desfazer button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;min-height:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--sab));background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.rec{width:88px;height:88px;border-radius:50%;background:var(--err);color:#fff;font-size:30px;margin:10px auto;display:flex;align-items:center;justify-content:center;padding:0}
.rec.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,28,28,.5)}100%{box-shadow:0 0 0 18px rgba(185,28,28,0)}}
.timer{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:28px;color:var(--navy)}
.frase{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.frase span{color:var(--green);font-weight:700}
.hide{display:none!important}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px}
.grid>div{min-width:0}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}.grid>div[style*="span 3"],.grid>div[style*="span 4"]{grid-column:span 2!important}}
.linhas{margin-top:6px}
.linha{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#FAFBFC}
.linha.vz{background:#fff;border-style:dashed}
.linha.vz.oc{display:none}
.lh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.lh b{color:var(--navy)}
.ass{border:1.5px dashed var(--navy);border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer}
.ass img{max-width:100%;max-height:120px}
.fotoass{min-height:140px}.fotoass img{max-height:260px;border-radius:8px}
.termo-txt{background:#F3F5F8;border-left:4px solid var(--green);border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.5;color:var(--ink)}

<script>
/* ============================================================
   CAMPO · Natural Engenharia — app de campo (PWA)
   Fonte da verdade: painel (via campo.json exportado). O app só lê.
   Envio: Apps Script (Robô de Campo) grava em 03_CAMPO da obra.
   ============================================================ */
const APP_VERSAO = '1.18.0';
const CFG_PADRAO = {
  script: 'https://script.google.com/macros/s/AKfycbx2mpnzRDmODfpWl3qX_fLr80RYK09kOIikrvhDUxU0vBzJC3RvL6ol93gADXptqkVF/exec', // Robô de Campo (Apps Script). Pode ser ajustada em Ajustes.
  token: 'natural-campo-2026',
  maxLado: 3200,              // maior lado da foto tirada na câmera do app (px) — ~8 MP
  qualidade: 0.92,
  maxLadoGaleria: 4096,       // foto puxada da galeria: já veio pronta, então redimensiona menos
  qualidadeGaleria: 0.96,     // e regrava com perda mínima
};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('nc_'+k); return v==null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('nc_'+k, JSON.stringify(v)); }catch(e){} },
};
const S = {
  cfg: (function(){ const c = Object.assign({}, CFG_PADRAO, LS.get('cfg', {})); if(!c.script) c.script = CFG_PADRAO.script; return c; })(),
  pacote: LS.get('pacote', null),
  quem: LS.get('quem', ''),
  quemId: LS.get('quemId', ''),          // id do funcionário no painel (FU...): base para a agenda individual
  fmt: LS.get('fmt', 'utm'),          // 'geo' | 'utm'
  marca: LS.get('marca', true),       // marca d'água da empresa nas fotos
  original: LS.get('original', true), // envia também o arquivo original sem carimbo
  salvarCel: LS.get('salvarCel', true), // v1.17.0: guarda cópia da foto tirada pelo app no próprio celular
  obraId: null, tab: 'roteiro',
  pos: null, posEm: 0, watch: null,
  fila: [], enviando: false,
};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function EH_APP(){ try{ return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone===true; }catch(e){ return false; } }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.promptInstalar=e; if(!S.obraId) try{ render(); }catch(_){} });
function barraDesfazer(msg, acao, ms=7000){ // apaga na hora, com chance de voltar atrás (nada de perguntar duas vezes)
  const v=$('#desfazer'); if(v) v.remove();
  const b=document.createElement('div'); b.id='desfazer'; b.innerHTML=`<span>${esc(msg)}</span><button>Desfazer</button>`;
  b.querySelector('button').onclick=async()=>{ b.remove(); try{ await acao(); }catch(e){ toast('Não deu para desfazer: '+e.message); } };
  document.body.appendChild(b); setTimeout(()=>{ if(b.isConnected) b.remove(); }, ms); }
function toast(m, ms=2200){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms); }
function hoje(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; } // data LOCAL (Boa Vista), não UTC
function agoraArq(){ const d=new Date(); return hoje()+'_'+[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(''); } // nome único: 2º áudio/registro do dia não some
function fmtData(d){ d = d instanceof Date ? d : new Date(d); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function exifData(d){ d = d instanceof Date ? d : new Date(d); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}:${p(d.getMonth()+1)}:${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function slug(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60); }

/* ---------------- Geodesia: GPS (WGS 84 ≈ SIRGAS 2000, mesmo elipsoide GRS80/WGS84 na prática) -> UTM ---------------- */
function toUTM(lat, lon){
  const a=6378137, f=1/298.257223563, k0=0.9996;
  const zone = Math.floor((lon+180)/6)+1, hemi = lat>=0?'N':'S';
  const lon0 = ((zone-1)*6-180+3)*Math.PI/180;
  const e2=f*(2-f), n=f/(2-f), A=a/(1+n)*(1+n*n/4+n*n*n*n/64);
  const al=[n/2-2*n*n/3+5*n*n*n/16, 13*n*n/48-3*n*n*n/5, 61*n*n*n/240];
  const phi=lat*Math.PI/180, lam=lon*Math.PI/180;
  const t=Math.sinh(Math.atanh(Math.sin(phi))-2*Math.sqrt(n)/(1+n)*Math.atanh(2*Math.sqrt(n)/(1+n)*Math.sin(phi)));
  const xi=Math.atan(t/Math.cos(lam-lon0)), eta=Math.atanh(Math.sin(lam-lon0)/Math.sqrt(1+t*t));
  let E=eta, N=xi;
  for(let j=1;j<=3;j++){ E+=al[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*eta); N+=al[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*eta); }
  E=500000+k0*A*E; N=k0*A*N; if(hemi==='S') N+=10000000;
  return {zone, hemi, e:Math.round(E), n:Math.round(N)};
}
function fmtCoord(p, fmt){ // SIRGAS 2000: o GPS dá WGS 84, que o IBGE considera equivalente na prática (diferença de centímetros)
  if(!p) return 'sem coordenada';
  if(fmt==='utm'){ const u=toUTM(p.lat,p.lon); return `UTM ${u.zone}${u.hemi}  E ${u.e}  N ${u.n}  (SIRGAS 2000)`; }
  return `${coordDMS(p)}`;
}
function fmtCoordCurta(p, fmt){
  if(!p) return '—';
  if(fmt==='utm'){ const u=toUTM(p.lat,p.lon); return `${u.zone}${u.hemi} ${u.e} E ${u.n} N`; }
  return `${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`;
}

/* ---------------- GPS ---------------- */
function iniciarGPS(forcar){
  if(!navigator.geolocation){ S.gpsErro={code:9}; atualizarGeo(); return; }
  if(S.watch!=null && !forcar && !S.gpsErro) return;
  /* v1.13.1: se o GPS deu erro (permissão negada, localização desligada, tempo esgotado), o watch
     antigo morria calado e nenhum botão conseguia religar. Agora todo toque tenta de novo. */
  if(S.watch!=null){ try{ navigator.geolocation.clearWatch(S.watch); }catch(_){} S.watch=null; }
  const ok=g=>{ S.gpsErro=null;
    S.pos = {lat:g.coords.latitude, lon:g.coords.longitude, acc:g.coords.accuracy, alt:g.coords.altitude};
    S.posEm = Date.now(); atualizarGeo(); };
  const er=e=>{ S.gpsErro={code:e.code, msg:e.message}; atualizarGeo();
    if(e.code===3){ /* só demorou: continua procurando sozinho */ setTimeout(()=>{ if(S.gpsErro&&S.gpsErro.code===3) iniciarGPS(true); }, 2000); }
    else { try{ navigator.geolocation.clearWatch(S.watch); }catch(_){} S.watch=null; } };
  /* pedido único dentro do toque: é o que faz o Android mostrar o "Permitir localização?" */
  try{ navigator.geolocation.getCurrentPosition(ok, er, {enableHighAccuracy:true, maximumAge:0, timeout:20000}); }catch(_){}
  S.watch = navigator.geolocation.watchPosition(ok, er, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
  /* v1.16.1: o celular às vezes NUNCA responde (pergunta de permissão escondida ou ignorada) e a tela ficava
     em "Procurando GPS…" para sempre, sem dizer nada. Depois de 12 s sem posição e sem erro, descobre o motivo e fala. */
  const pedido=S.gpsPedidoEm=Date.now();
  setTimeout(()=>{ if(S.gpsPedidoEm!==pedido || posFresca() || S.gpsErro) return;
    const marca=c=>{ if(!posFresca() && !S.gpsErro){ S.gpsErro={code:c}; atualizarGeo(); } };
    try{ if(navigator.permissions) navigator.permissions.query({name:'geolocation'}).then(st=>marca(st.state==='prompt'?4:(st.state==='denied'?1:5))).catch(()=>marca(5)); else marca(5); }catch(_){ marca(5); }
  }, 12000);
}
/* frase que o funcionário entende e consegue resolver sozinho */
function textoErroGPS(){
  const e=S.gpsErro; if(!e) return '';
  if(e.code===1) return 'GPS BLOQUEADO para o app. Toque no cadeado ao lado do endereço (ou ⋮ > Configurações > Configurações do site > Localização) e escolha PERMITIR. Se continuar: Configurações do Android > Apps > Chrome > Permissões > Localização > Permitir, com "Usar localização precisa" LIGADO.';
  if(e.code===2) return 'Localização do celular DESLIGADA. Puxe a barra de cima e ligue "Localização"; depois toque de novo.';
  if(e.code===3) return 'GPS ainda procurando sinal… vá para céu aberto e espere alguns segundos.';
  if(e.code===4) return 'O celular ainda NÃO deu permissão de localização para o app. Toque em "Ligar o GPS" e escolha PERMITIR. Se a pergunta não aparecer: toque no ícone ao lado do endereço (ou ⋮ > Configurações > Configurações do site > Localização) e escolha Permitir.';
  if(e.code===5) return 'O app tem permissão, mas o celular não está mandando a posição. Confira: Localização LIGADA, "Usar localização precisa" LIGADO (Configurações > Localização) e economia de bateria DESLIGADA. Vá para céu aberto e toque em "Ligar o GPS".';
  return 'Este navegador não dá GPS. Abra o app pelo Chrome.';
}
/* avisa já na abertura se o GPS está bloqueado, sem esperar o funcionário tentar tirar a foto */
try{ navigator.permissions && navigator.permissions.query({name:'geolocation'}).then(st=>{
  const ver=()=>{ if(st.state==='denied'){ S.gpsErro={code:1}; atualizarGeo(); } else if(S.gpsErro&&S.gpsErro.code===1){ iniciarGPS(true); } };
  ver(); st.onchange=ver; }).catch(()=>{}); }catch(_){}
/* coordenada só vale se for de agora: carro andou 60 km com o app em segundo plano e a
   posição velha saía carimbada na foto da obra seguinte */
function posFresca(ms){ return (S.pos && S.posEm && Date.now()-S.posEm <= (ms||60000)) ? S.pos : null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(S.gpsErro) iniciarGPS(true); if(S.posEm && Date.now()-S.posEm>60000) atualizarGeo(); if(navigator.onLine) enviarFila();
    /* v1.18.0: app que fica dias aberto também procura versão nova (antes só procurava ao abrir do zero) */
    try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{}); }catch(e){} }
  /* v1.18.0: ao sair do app (trocar de tela, bloquear o celular), a ficha aberta com dado novo sobe na hora */
  if(navigator.onLine) autoParciais(); });
async function autoParciais(){ try{ if(!S.enviando && window.FICHAS_PARCIAIS && await window.FICHAS_PARCIAIS.auto()) enviarFila(); }catch(e){} }
function atualizarGeo(err){
  const ge=textoErroGPS();
  const g0=$('#geoLive'); if(g0 && ge && !posFresca()) g0.textContent=ge;
  const el=$('#camGeo'); if(!el) return;
  if(posFresca()){ el.textContent = fmtCoord(S.pos, S.fmt) + `  ±${Math.round(S.pos.acc)} m`; }
  else el.textContent = ge ? ge : (S.pos ? 'GPS desatualizado — procurando de novo…' : 'Procurando GPS…');
  const g=$('#geoLive'); if(g && !(ge && !posFresca())) g.textContent = S.pos ? fmtCoord(S.pos,S.fmt)+`  ±${Math.round(S.pos.acc)} m` : 'Procurando GPS… (funciona sem internet; a céu aberto fixa mais rápido)';
}

/* ---------------- IndexedDB (fila de envio) ---------------- */
const DB = {
  db:null,
  open(){ return new Promise((ok,er)=>{ const r=indexedDB.open('natural_campo',1);
    r.onupgradeneeded=()=>{ const d=r.result; const st=d.createObjectStore('fila',{keyPath:'id'}); st.createIndex('status','status'); };
    r.onsuccess=()=>{DB.db=r.result; ok();}; r.onerror=()=>er(r.error); }); },
  tx(mode){ return DB.db.transaction('fila',mode).objectStore('fila'); },
  put(o){ return new Promise((ok,er)=>{ const q=DB.tx('readwrite').put(o); q.onsuccess=()=>ok(); q.onerror=()=>er(q.error); }); },
  del(id){ return new Promise((ok,er)=>{ const q=DB.tx('readwrite').delete(id); q.onsuccess=()=>ok(); q.onerror=()=>er(q.error); }); },
  all(){ return new Promise((ok,er)=>{ const q=DB.tx('readonly').getAll(); q.onsuccess=()=>ok(q.result||[]); q.onerror=()=>er(q.error); }); },
  get(id){ return new Promise((ok,er)=>{ const q=DB.tx('readonly').get(id); q.onsuccess=()=>ok(q.result||null); q.onerror=()=>er(q.error); }); },
};
async function recarregarFila(){ S.fila = (await DB.all()).sort((a,b)=>a.criadoEm<b.criadoEm?-1:1); pintarFila(); }
function pintarFila(){
  // dentro de uma obra, a barra mostra só o que é DESTA obra (o resto sobe igual, em silêncio)
  const daObra = S.obraId ? S.fila.filter(x=>x.obraId===S.obraId) : S.fila;
  const naFila=x=>x.status==='pendente'||x.status==='erro';
  const pend=daObra.filter(naFila), err=daObra.filter(x=>x.status==='erro'), esperando=daObra.filter(x=>x.status==='aguardando');
  const outras = S.obraId ? S.fila.filter(x=>x.obraId && x.obraId!==S.obraId && naFila(x)).length : 0;
  const hojeEnv=daObra.filter(x=>x.status==='enviado' && (x.enviadoEm||'').slice(0,10)===hoje()).length;
  const t=$('#filaTxt'), b=$('#filaBtn');
  if(S.enviando){ t.innerHTML=`<b>Enviando…</b> ${pend.length} na fila`; b.disabled=true; return; }
  // v1.16.0: ficha aberta com dado novo também conta — o botão manda como PARCIAL, sem exigir critério nenhum
  let parc=0; try{ if(window.FICHAS_PARCIAIS) parc=window.FICHAS_PARCIAIS.pendentes(S.obraId||null); }catch(e){}
  b.disabled = pend.length===0 && outras===0 && parc===0;
  const nota = (outras? ` · <span class="muted">${outras} de outras obras</span>`:'') + (parc? `<br><span style="font-weight:700">📋 ${parc} ficha(s) aberta(s) com dado novo — "Enviar agora" manda o que já tem (parcial)</span>`:'') + (esperando.length? `<br><span style="color:var(--err);font-weight:700">🎙 ${esperando.length} áudio gravado e NÃO enviado — aba Diário, botão Enviar</span>`:'');
  if(pend.length===0) t.innerHTML = `<b>${hojeEnv? (S.obraId?'Tudo enviado desta obra.':'Tudo enviado.') : (S.obraId?'Nada na fila desta obra.':'Nada na fila.')}</b> ${hojeEnv? hojeEnv+' arquivo(s) hoje.':''} ${navigator.onLine?'':'Sem internet.'}${nota}`;
  else t.innerHTML = `<b>${pend.length} na fila${S.obraId?' desta obra':''}</b>${err.length?` · <span style="color:var(--err)">${err.length} com erro</span>`:''} · ${navigator.onLine?'com internet':'sem internet — sobe sozinho depois'}${nota}`;
}

/* ---------------- EXIF: leitura (GPS, data, orientação) ---------------- */
function lerExif(buf){
  const v=new DataView(buf); if(v.getUint16(0)!==0xFFD8) return {};
  let off=2; while(off<v.byteLength){
    const m=v.getUint16(off); if(m===0xFFDA) break; const len=v.getUint16(off+2);
    if(m===0xFFE1 && v.getUint32(off+4)===0x45786966){ try{ return parseTiff(buf, off+10, len-8); }catch(e){ return {}; } }
    off+=2+len;
  } return {};
}
function parseTiff(buf, base, size){
  const v=new DataView(buf, base, size); const le=v.getUint16(0)===0x4949;
  const u16=o=>v.getUint16(o,le), u32=o=>v.getUint32(o,le);
  const out={};
  function readIFD(off, tags){
    const n=u16(off); const r={};
    for(let i=0;i<n;i++){ const e=off+2+i*12; const tag=u16(e), type=u16(e+2), cnt=u32(e+4); let val;
      const sz={1:1,2:1,3:2,4:4,5:8,7:1,10:8}[type]||1; const tot=sz*cnt; const p= tot<=4 ? e+8 : u32(e+8);
      if(tags && !tags.includes(tag)) continue;
      if(type===2){ let s=''; for(let k=0;k<cnt-1;k++) s+=String.fromCharCode(v.getUint8(p+k)); val=s; }
      else if(type===3){ val=cnt===1?u16(p):Array.from({length:cnt},(_,k)=>u16(p+2*k)); }
      else if(type===4){ val=cnt===1?u32(p):Array.from({length:cnt},(_,k)=>u32(p+4*k)); }
      else if(type===5){ val=Array.from({length:cnt},(_,k)=>u32(p+8*k)/(u32(p+8*k+4)||1)); if(cnt===1) val=val[0]; }
      else if(type===1){ val=cnt===1?v.getUint8(p):Array.from({length:cnt},(_,k)=>v.getUint8(p+k)); }
      r[tag]=val; }
    return r;
  }
  const ifd0=readIFD(u32(4),[0x0112,0x8769,0x8825]);
  out.orient=ifd0[0x0112]||1;
  if(ifd0[0x8769]){ const ex=readIFD(ifd0[0x8769],[0x9003]); out.data=ex[0x9003]; }
  if(ifd0[0x8825]){ const g=readIFD(ifd0[0x8825],[1,2,3,4,5,6]);
    if(g[2]&&g[4]){ const dms=a=>a[0]+a[1]/60+a[2]/3600; let lat=dms(g[2]), lon=dms(g[4]);
      if((g[1]||'N')==='S') lat=-lat; if((g[3]||'E')==='W') lon=-lon;
      if(isFinite(lat)&&isFinite(lon)&&(lat||lon)) out.gps={lat,lon,alt:g[6]!=null?(g[5]?-g[6]:g[6]):null}; } }
  return out;
}
/* ---------------- EXIF: escrita (GPS + data + descrição) ---------------- */
function montarExif(meta){
  // meta: {data:Date, gps:{lat,lon,alt}, desc}
  const enc=s=>{ const t=String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'-'); return new TextEncoder().encode(t+'\0'); };
  const rat=(x,den=1000000)=>[Math.round(x*den),den];
  const dms=deg=>{ deg=Math.abs(deg); const d=Math.floor(deg), m=Math.floor((deg-d)*60), s=((deg-d)*60-m)*60; return [[d,1],[m,1],[Math.round(s*10000),10000]]; };
  function ifd(entries){ // entries: [{tag,type,val}] val: Uint8Array(ASCII/BYTE) | number[] (LONG/SHORT) | [[n,d],...] (RATIONAL)
    const n=entries.length; const head=2+12*n+4; let data=[]; let dsize=0;
    const recs=entries.map(e=>{ let bytes; let cnt;
      if(e.type===2||e.type===1){ bytes=e.val; cnt=bytes.length; }
      else if(e.type===4||e.type===3){ cnt=e.val.length; bytes=new Uint8Array(cnt*(e.type===4?4:2)); const dv=new DataView(bytes.buffer); e.val.forEach((x,i)=> e.type===4? dv.setUint32(i*4,x,true): dv.setUint16(i*2,x,true)); }

  const ents0=[{tag:0x010E,type:2,val:enc(meta.desc||'Natural Engenharia')},{tag:0x0131,type:2,val:enc('Campo Natural '+APP_VERSAO)},{tag:0x0132,type:2,val:enc(dstr)},{tag:0x8769,type:4,val:[0]}];

}

/* ---------------- Carimbo e marca d'água ---------------- */
const IMG={ logo:null, logoN:null };
function carregarImg(src){ return new Promise((ok,er)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=er; i.src=src; }); }
async function carimbar(bitmap, info, q){
  // info: {obra, quem, slot, pos:{lat,lon,acc}|null, fonte:'aparelho'|'foto'|null, data:Date, fmt, marca}
  const W=bitmap.width, H=bitmap.height; const cv=$('#cv'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
  c.drawImage(bitmap,0,0);

  await prepararFonteCarimbo();
  desenharCarimbo(c,W,H,info);
  return new Promise(ok=> cv.toBlob(ok,'image/jpeg', q || S.cfg.qualidade));

/* Carimbo no estilo "Timestamp Camera": texto branco com sombra, sem tarja, canto inferior esquerdo.
   Hora grande | data e dia da semana · obra · coordenada em graus-minutos-segundos e UTM (SIRGAS 2000)
   · precisão, origem do GPS, quem e o item. Logo da Natural logo acima (desliga para trabalho de terceiros). */
const FONTE_CARIMBO="'Roboto Condensed','Arial Narrow','Roboto',Arial,sans-serif";
const SEMANA=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function dms(v, pos, neg){ const h=v<0?neg:pos; v=Math.abs(v); let g=Math.floor(v), m=Math.floor((v-g)*60), s=((v-g)*60-m)*60;
  if(+s.toFixed(2)>=60){ s=0; m++; } if(m>=60){ m=0; g++; }
  return `${g}°${String(m).padStart(2,'0')}'${s.toFixed(2).padStart(5,'0').replace('.',',')}" ${h}`; }
function coordDMS(p){ return `${dms(p.lat,'N','S')}   ${dms(p.lon,'E','W')}`; }
function milhar(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function coordUTMtxt(p){ const u=toUTM(p.lat,p.lon); return `UTM ${u.zone}${u.hemi}   E ${milhar(u.e)}   N ${milhar(u.n)}`; }
function textoCoordFicha(p){ if(!p) return ''; const u=toUTM(p.lat,p.lon); return `UTM ${u.zone}${u.hemi} E ${u.e} N ${u.n} (SIRGAS 2000) · ${coordDMS(p)} · Lat ${p.lat.toFixed(6)} Lon ${p.lon.toFixed(6)} · ±${Math.round(p.acc||0)} m (GPS do celular)`; }
function desenharCarimbo(c,W,H,info){
  // Carimbo enxuto: só as coordenadas e o N da Natural. Data, hora, quem tirou e o item
  // já ficam no nome do arquivo e no EXIF — não precisam tomar a imagem.
  const base=Math.min(W,H); const fs=Math.max(13,Math.round(base*0.030)); const m=Math.round(base*0.028); const lh=Math.round(fs*1.3);
  const linhas=[];
  if(info.pos){
    // uma coordenada por vez: o que estiver escolhido no botão da câmera (UTM ou Lat/Lon)
    const erro = info.pos.acc? `±${Math.round(info.pos.acc)} m` : '';
    if(info.fmt==='utm'){ linhas.push({t:coordUTMtxt(info.pos), w:700});
      linhas.push({t:['SIRGAS 2000',erro].filter(Boolean).join('   ·   '), w:400, k:0.8}); }
    else { linhas.push({t:coordDMS(info.pos), w:700});
      if(erro) linhas.push({t:erro, w:400, k:0.8}); }
  }
  else linhas.push({t:'SEM COORDENADA (GPS indisponível)', w:700});
  const alturaTexto = linhas.reduce((a,l)=>a+lh*(l.k||1),0);
  const logoH = (info.marca && IMG.logoN) ? Math.round(alturaTexto*0.92) : 0;
  const logoW = logoH ? Math.round(logoH*IMG.logoN.width/IMG.logoN.height) : 0;
  const gap = logoH? Math.round(fs*0.6) : 0;
  const x0 = m, yTopo = H - m - alturaTexto;
  c.save();
  // leve escurecida só atrás do bloco, para ler em foto clara
  const gr=c.createLinearGradient(0,yTopo-fs*0.8,0,H); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,0.38)');
  c.fillStyle=gr; c.fillRect(0,yTopo-fs*0.8,W,H-(yTopo-fs*0.8));
  c.textBaseline='alphabetic'; c.shadowColor='rgba(0,0,0,0.75)'; c.shadowBlur=Math.max(2,fs*0.25); c.shadowOffsetX=1; c.shadowOffsetY=1; c.fillStyle='#fff';
  if(logoH) c.drawImage(IMG.logoN, x0, yTopo + (alturaTexto-logoH)/2, logoW, logoH);
  const xt = x0 + logoW + gap; let y = yTopo;
  for(const l of linhas){ const f=Math.round(fs*(l.k||1)); c.font=`${l.w} ${f}px ${FONTE_CARIMBO}`; y+=lh*(l.k||1);
    let t=l.t; while(c.measureText(t).width>W-xt-m && t.length>8) t=t.slice(0,-4)+'…'; c.fillText(t,xt,y-lh*0.25); }
  c.restore();
}
async function prepararFonteCarimbo(){ try{ await Promise.all([document.fonts.load(`700 40px ${FONTE_CARIMBO}`), document.fonts.load(`400 40px ${FONTE_CARIMBO}`)]); }catch(e){} }
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
async function bitmapDe(blob){
  try{ return await createImageBitmap(blob,{imageOrientation:'from-image'}); }catch(e){ return await createImageBitmap(blob); }
}
const AREA_MAX_CANVAS = 16777216; // limite prático de canvas no iPhone (~16,7 MP): acima disso a tela sai borrada
function desenhoLiso(c){ c.imageSmoothingEnabled=true; try{ c.imageSmoothingQuality='high'; }catch(e){} return c; }
async function redimensionar(bmp, max){
  const W=bmp.width, H=bmp.height;
  let k=Math.min(1, max/Math.max(W,H));
  if(W*H*k*k > AREA_MAX_CANVAS) k=Math.min(k, Math.sqrt(AREA_MAX_CANVAS/(W*H)));
  if(k>=1) return bmp;
  const alvoW=Math.max(1,Math.round(W*k)), alvoH=Math.max(1,Math.round(H*k));
  // reduz em etapas de no máximo 50% por vez: uma redução grande de uma vez só borra a foto
  let atual=bmp;
  while(atual.width > alvoW*2){
    const w=Math.round(atual.width/2), h=Math.max(1,Math.round(atual.height/2));
    const oc=document.createElement('canvas'); oc.width=w; oc.height=h;
    desenhoLiso(oc.getContext('2d')).drawImage(atual,0,0,w,h);
    const prox=await createImageBitmap(oc);
    if(atual!==bmp && atual.close) atual.close();
    atual=prox;
  }
  const oc=document.createElement('canvas'); oc.width=alvoW; oc.height=alvoH;
  desenhoLiso(oc.getContext('2d')).drawImage(atual,0,0,alvoW,alvoH);
  if(atual!==bmp && atual.close) atual.close();
  return await createImageBitmap(oc);
}

         else if(posFresca() && Math.abs(Date.now()-data.getTime()) <= 2*3600e3){ pos=S.pos; fonte='aparelho-tardio'; } }

  const carimbo=await carimbar(bmp,{obra:ob.nome, quem:S.quem, slot:opts.slotTitulo, pos, fonte, data, fmt:S.fmt, marca:S.marca}, qual);
  const comExif=await inserirExif(carimbo,{data, gps:pos?{lat:pos.lat,lon:pos.lon,alt:pos.alt}:null, desc:`${ob.nome} · ${opts.slotTitulo||''} · ${S.quem||''}`});
  const id='F'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  else if(S.original && opts.fonte==='galeria'){
    await guardar({ id:id+'o', tipo:'foto', obraId:ob.id, obraNome:ob.nome, pastaId:ob.pastaId||null, quem:S.quem, slot:opts.slot, slotTitulo:opts.slotTitulo, nome:nomeBase+'_original.'+(blobOriginal.type.split('/')[1]||'jpg').replace('jpeg','jpg'), mime:blobOriginal.type||'image/jpeg', blob:blobOriginal, thumb:null, meta:Object.assign({},meta,{original:true}), status:'pendente', criadoEm:new Date().toISOString() }); }

/* ---------- CÓPIA NO CELULAR (v1.17.0) ----------
 * Pedido do Ygor (09/10/2026): foto tirada pelo app fica salva também no celular, Android e iPhone.
 * App de navegador não grava direto na galeria. Android: o arquivo cai sozinho em Downloads (Galeria/Google Fotos
 * mostram). iPhone: o sistema exige um toque — "Salvar no celular" abre a folha do iOS com "Salvar N imagens".
 * Foto puxada da galeria não entra (já está no celular). Vai a versão carimbada. */

  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); },5000); return true; }catch(e){ return false; } }
function fotosSemCopia(obraId){ return (S.fila||[]).filter(x=>x.tipo==='foto' && !x.meta?.original && x.meta?.origem==='camera' && !x.noCel && x.blob && (!obraId||x.obraId===obraId)); }
async function salvarNoCelular(obraId){ const fs=fotosSemCopia(obraId); if(!fs.length) return toast('Todas as fotos já estão no celular ✓');
  if(EH_IOS){ const lote=fs.slice(0,10); const files=lote.map(x=>new File([x.blob],x.nome,{type:x.mime||'image/jpeg'}));
    if(!(navigator.canShare && navigator.canShare({files}))) return toast('Este iPhone não deixa o app salvar fotos. Atualize o iOS (16 ou mais novo).',5000);
    try{ await navigator.share({files}); for(const x of lote){ x.noCel=true; if(x.status==='enviado') x.blob=null; await DB.put(x); } await recarregarFila(); render();
      const r=fs.length-lote.length; toast(r?`${lote.length} salvas. Faltam ${r}: toque de novo em Salvar no celular.`:'Fotos salvas no celular ✓',4500); }
    catch(e){ if(e.name!=='AbortError') toast('Não consegui salvar: '+e.message,4500); }
    return; }
  for(const x of fs){ if(baixarNoCel(x.blob,x.nome)){ x.noCel=true; if(x.status==='enviado') x.blob=null; await DB.put(x); } await new Promise(r=>setTimeout(r,400)); }
  await recarregarFila(); render(); toast('Fotos salvas no celular (pasta Downloads) ✓',4500); }
function cartaoCopiaCel(ob){ if(!S.salvarCel) return ''; const n=fotosSemCopia(ob.id).length; if(!n) return '';

async function enviarFila(){

  S.enviando=true; pintarFila();
  try{
    const fila=S.fila.filter(x=>x.status==='pendente'||x.status==='erro').sort((a,b)=>((a.blob&&a.blob.size)||0)-((b.blob&&b.blob.size)||0));
    for(const it of fila){

      try{

        const corpo={ token:S.cfg.token, acao:'enviar', id:it.id, obraId:it.obraId, obraNome:it.obraNome, pastaId:it.pastaId, quem:it.quem, tipo:it.tipo, slot:it.slot, slotTitulo:it.slotTitulo, nome:it.nome, mime:it.mime, meta:it.meta, criadoEm:it.criadoEm, b64: await b64(it.blob) };

        const j=await r.json().catch(()=>({ok:false,erro:'resposta inválida'}));
        if(j.ok){ it.status='enviado'; it.enviadoEm=new Date().toISOString(); it.url=j.url||null; it.pasta=j.pasta||null; it.marco=j.marco||null; it.transito=!!j.transito; it.erro=null; it.erroEm=null;
          try{ const at=await DB.get(it.id); if(at&&at.noCel) it.noCel=true; }catch(_){}

          if(!(S.salvarCel && it.tipo==='foto' && it.meta?.origem==='camera' && !it.meta?.original && !it.noCel)) it.blob=null; }

      await DB.put(it); pintarFila();

    }
  } finally { S.enviando=false; await recarregarFila(); setTimeout(relatarEstado, 1500); try{ if(window.FICHAS && FICHAS.aliviarMemoria) FICHAS.aliviarMemoria(); }catch(e){} if(!(window.FICHAS && FICHAS.aberta())) render(); }
}

/* ---------------- Vídeo (câmera do app e galeria) ----------------

  const k=Math.min(1, VID.LADO/Math.max(v.videoWidth,v.videoHeight)); const W=Math.round(v.videoWidth*k/2)*2, H=Math.round(v.videoHeight*k/2)*2;

  rec.onstop=()=>salvarGravacao();
  CAM.rec.thumb=null; desenha(); setTimeout(()=>{ try{ const oc=document.createElement('canvas'); const kk=220/Math.max(W,H); oc.width=W*kk; oc.height=H*kk; oc.getContext('2d').drawImage(cv,0,0,oc.width,oc.height); if(CAM.rec) CAM.rec.thumb=oc.toDataURL('image/jpeg',0.6); }catch(e){} },400);

function pararGravacao(){ const R=CAM.rec; if(!R) return; clearInterval(CAM.relogio); cancelAnimationFrame(CAM.raf); try{ if(R.rec.state!=='inactive') R.rec.stop(); }catch(e){ salvarGravacao(); } }
async function salvarGravacao(){

async function videoDaGaleria(f, slot, slotTitulo, extra){

    return enfileirarVideo(f,{slot, slotTitulo, origem:'galeria', data:new Date(f.lastModified||Date.now()), pos, fonte, thumb, extra, carimbado:false}); }
  const mb=(f.size/1048576).toFixed(0);

  try{ const r=await recomprimir(f, slotTitulo); await enfileirarVideo(r.blob,{slot, slotTitulo, origem:'galeria-recomprimido', data:new Date(f.lastModified||Date.now()), pos, fonte, thumb:r.thumb, seg:r.seg, extra, carimbado:true}); }

function quadroDoVideo(f){ return new Promise((ok,er)=>{ const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.preload='metadata'; const u=URL.createObjectURL(f); v.src=u;
  v.onloadeddata=()=>{ v.currentTime=Math.min(1,(v.duration||2)/2); }; v.onseeked=()=>{ try{ const oc=document.createElement('canvas'); const k=220/Math.max(v.videoWidth,v.videoHeight); oc.width=v.videoWidth*k; oc.height=v.videoHeight*k; oc.getContext('2d').drawImage(v,0,0,oc.width,oc.height); ok(oc.toDataURL('image/jpeg',0.6)); }catch(e){ er(e); } URL.revokeObjectURL(u); }; v.onerror=()=>er(new Error('vídeo ilegível')); setTimeout(()=>er(new Error('tempo')),8000); }); }
function recomprimir(f, slotTitulo){ return new Promise(async (ok,er)=>{

  const v=document.createElement('video'); v.playsInline=true; const u=URL.createObjectURL(f); v.src=u;
  await new Promise((a,b)=>{ v.onloadedmetadata=a; v.onerror=()=>b(new Error('vídeo ilegível')); }).catch(er);

  const partes=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) partes.push(e.data); };
  const data=new Date(f.lastModified||Date.now()); let thumb=null, raf=0;
  const desenha=()=>{ c.drawImage(v,0,0,W,H); desenharCarimbo(c,W,H,{obra:ob.nome, quem:S.quem, slot:'VÍDEO · '+slotTitulo, pos:S.pos, fonte:S.pos?'aparelho-tardio':null, data, fmt:S.fmt, marca:S.marca});
    if(!thumb && v.currentTime>0.3){ const oc=document.createElement('canvas'); const kk=220/Math.max(W,H); oc.width=W*kk; oc.height=H*kk; oc.getContext('2d').drawImage(cv,0,0,oc.width,oc.height); thumb=oc.toDataURL('image/jpeg',0.6); }
    if(!v.ended) raf=requestAnimationFrame(desenha); };

  rec.onstop=()=>{ clearInterval(prog); cancelAnimationFrame(raf); URL.revokeObjectURL(u); const b=new Blob(partes,{type:(rec.mimeType||tipo||'video/webm').split(';')[0]});

function fotosDoSlot(slot){ const ob=obraAtual(); if(!ob) return []; return (S.fila||[]).filter(x=>x.obraId===ob.id && x.slot===slot && (x.tipo==='foto'||x.tipo==='video') && !x.meta?.original); }

/* ---------------- Áudio do diário ---------------- */
const REC={ mr:null, chunks:[], t0:0, timer:null, blob:null, obraId:null, ultimoId:null }; // obraId: o áudio gravado é só da obra em que foi gravado
async function gravar(){
  if(REC.mr){ REC.mr.stop(); return; }
  const ob=obraAtual(); if(ob && audiosDeHoje(ob)>=2){ toast('Já são 2 áudios desta obra hoje. Apague um na aba Fotos se precisar gravar outro.',5000); return; }
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:true}); const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac',''].find(m=>!m||MediaRecorder.isTypeSupported(m));
    REC.mr=new MediaRecorder(st, mime?{mimeType:mime}:undefined); REC.chunks=[]; REC.blob=null; REC.obraId=S.obraId;
    REC.mr.ondataavailable=e=>REC.chunks.push(e.data);
    REC.mr.onstop=async()=>{ st.getTracks().forEach(t=>t.stop()); REC.blob=new Blob(REC.chunks,{type:REC.mr.mimeType||'audio/webm'}); REC.mr=null; clearInterval(REC.timer); const ext=(REC.blob.type.includes('mp4')||REC.blob.type.includes('aac'))?'m4a':'webm'; try{ REC.ultimoId=await enfileirarArquivo(REC.blob,'audio',`${agoraArq()}_diario_${slug(S.quem)}.${ext}`,null,{obraId:REC.obraId, status:'aguardando'}); toast('Áudio gravado. Ouça e toque em ENVIAR.'); }catch(e){} render(); };
    REC.mr.start(); REC.t0=Date.now(); REC.timer=setInterval(()=>{ const s=Math.floor((Date.now()-REC.t0)/1000); const el=$('#timer'); if(el) el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')} / 00:40`; if(s>=40 && REC.mr) REC.mr.stop(); },250);
    render();
  }catch(e){ toast('Microfone indisponível: '+e.message); }
}

function sopsDaObra(ob){ const P=S.pacote; if(!P||!ob) return []; return (ob.sops||[]).map(c=>P.sops[c]).filter(Boolean); }
function slotsDaObra(){ const P=S.pacote; const base=(P?.roteiroFotos||[]).map(s=>({k:s.k,t:s.t,d:s.d})); base.push({k:'ficha',t:'Ficha preenchida',d:'Foto da ficha de campo preenchida, legível, folha inteira.'}); base.push({k:'extra',t:'Foto extra',d:'Qualquer outra foto que ajude o escritório.'}); base.push({k:'ocorrencia',t:'Ocorrência',d:'Local, equipamento e causa, antes de mexer.'});
  if(temMarcos(obraAtual())) base.splice(P?.roteiroFotos?.length||0,0,{k:'marco',t:'Marco',d:'Chapa do marco de perto, legível. Uma foto por marco (ou mais, se precisar).'});

/* ---------- ESTADO DO APARELHO (v1.15.0) ----------
 * Erro de envio ou arquivo parado ficava só no celular: o escritório não sabia.
 * Agora o app manda um bilhete pequeno (JSON) ao robô dizendo o que está preso. Ele sobe
 * na frente dos arquivos grandes (a fila manda os menores primeiro). Quando resolve, avisa também. */
function problemasAparelho(){ const ag=Date.now();
  return (S.fila||[]).filter(x=>x.obraId && (x.status==='erro' || ((x.status==='pendente'||x.status==='aguardando') && ag-new Date(x.criadoEm).getTime()>(x.status==='aguardando'?2:24)*36e5))); }
async function relatarEstado(){
  try{ if(!S.cfg.script || !S.quem) return; const pr=problemasAparelho(); const ult=LS.get('estadoUlt',{});
    let ab=[]; try{ ab=(window.FICHAS_PARCIAIS&&window.FICHAS_PARCIAIS.abertas)?window.FICHAS_PARCIAIS.abertas():[]; }catch(e){}
    /* só entra a ficha com dado novo parado há mais de 30 min (com sinal ela sobe sozinha antes disso) */
    ab=ab.filter(f=>Date.now()-new Date(f.ultimaParcialEm||f.criadoEm).getTime()>30*6e4);
    const chave=(pr.length||ab.length)? pr.map(x=>x.id+':'+x.status).concat(ab.map(f=>'ficha:'+f.fichaId)).sort().join(',') : 'ok';
    const velho=Date.now()-(+ult.em||0) > 6*36e5;
    if(chave===ult.chave && !((pr.length||ab.length) && velho)) return;
    if(chave==='ok' && !ult.chave) return; /* nunca teve problema: não manda nada */
    LS.set('estadoUlt',{chave, em:Date.now()});
    const itens=pr.slice(0,30).map(x=>({obraId:x.obraId, obra:x.obraNome, o:rotuloEnvio(x), nome:x.nome, st:x.status, erro:String(x.erro||'').slice(0,160), criadoEm:x.criadoEm, erroEm:x.erroEm||null}));
    const obj={ tipo:'estado_aparelho', quem:S.quem, quemId:S.quemId||'', em:new Date().toISOString(), app:APP_VERSAO, online:navigator.onLine,
      totais:{ erro:pr.filter(x=>x.status==='erro').length, parado:pr.filter(x=>x.status!=='erro').length, fila:(S.fila||[]).filter(x=>x.status!=='enviado').length, fichasAbertas:ab.length }, itens, fichasAbertas:ab.slice(0,30), tudoCerto:!pr.length && !ab.length };
    const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
    await enfileirarArquivo(blob,'registro',`${agoraArq()}_ESTADO_APARELHO_${slug(S.quem)}.json`, { tipo:'estado_aparelho', quemId:obj.quemId, totais:obj.totais, itens:itens.slice(0,15), fichasAbertas:ab.slice(0,10), tudoCerto:obj.tudoCerto },
      { obra:{ id:'', nome:'_ESTADO_DOS_APARELHOS', pastaId:null } });
  }catch(e){ console.warn('estado', e); } }

const DIAS_SEM=['dom','seg','ter','qua','qui','sex','sáb'];
function agEventos(){ const P=S.pacote||{}; if(Array.isArray(P.agenda)&&P.agenda.length) return P.agenda.slice().sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')));
  const vistos={}, out=[]; (P.equipe||[]).forEach(f=>(f.agenda||[]).forEach(e=>{ if(e&&e.id&&!vistos[e.id]){ vistos[e.id]=1; out.push(e); } }));

function agTemDados(){ const P=S.pacote||{}; return Array.isArray(P.agenda) || (P.equipe||[]).some(f=>Array.isArray(f.agenda)||Array.isArray(f.tarefas)); }
function agMeus(ev){ return ev.filter(e=>e.todos || (e.funcs||[]).includes(S.quemId)); }
function agTarefas(){ const f=((S.pacote&&S.pacote.equipe)||[]).find(x=>x.id===S.quemId); return (f&&f.tarefas)||[]; }
function agNome(id){ const f=((S.pacote&&S.pacote.equipe)||[]).find(x=>x.id===id); return f?nomeCurto(f.nome):id; }
function agDia(iso){ const h=hoje(); if(iso===h) return 'Hoje';
  const d=new Date(iso+'T12:00:00'), t=new Date(h+'T12:00:00'); const dd=Math.round((d-t)/864e5);

  return `${DIAS_SEM[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }
function agDataCurta(iso){ if(!iso) return ''; const [a,m,d]=iso.split('-'); return `${d}/${m}`; }

function cartaoFilaInicio(pend){ /* inclui áudio esperando o Enviar: na tela inicial ninguém esquece */

/* tarefas em grupos que terminam: atrasadas, hoje, esta semana, mais adiante, esperando outra pessoa */
function agGrupos(tar){ const h0=hoje(); const fim=new Date(h0+'T12:00:00'); fim.setDate(fim.getDate()+7);
  const fimIso=`${fim.getFullYear()}-${String(fim.getMonth()+1).padStart(2,'0')}-${String(fim.getDate()).padStart(2,'0')}`;
  const g={atrasadas:[],hoje:[],semana:[],depois:[],espera:[]};
  tar.forEach(t=>{ if(t.status==='espera') g.espera.push(t); else if(t.prazo&&t.prazo<h0) g.atrasadas.push(t); else if(t.prazo===h0) g.hoje.push(t); else if(t.prazo&&t.prazo<=fimIso) g.semana.push(t); else g.depois.push(t); });
  const pr=t=>(t.prioridade==='alta'||t.prioridade==='urgente')?'0':'1';
  Object.values(g).forEach(a=>a.sort((a,b)=>((a.prazo||'9999')+pr(a)).localeCompare((b.prazo||'9999')+pr(b))));
  return g; }
function agDiaLongo(iso){ const d=new Date(iso+'T12:00:00'); const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const mes=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  return `${dias[d.getDay()]}, ${d.getDate()} de ${mes[d.getMonth()]}`; }
function agObraNome(id){ const o=(S.pacote?.obras||[]).find(x=>x.id===id); return o?o.nome:''; }
function agLocalObra(id){ const e=agEventos().find(x=>x.obraId===id && x.onde); return e?e.onde:''; }
function telaHoje(tar,g){

  if(!S.quemId) return h+`<div class="card"><div class="muted">${S.quem?'Este nome não está na lista da equipe, então não há agenda individual. Toque em <b>Trocar</b> e escolha o seu nome.':'Escolha o seu nome acima para ver a sua agenda.'}</div></div>`+agEmpresa(ev);

     `<button data-ini="tarefas" class="pl w"><b>${g.hoje.length}</b><span>para hoje</span></button>`+
     `<button data-ini="tarefas" class="pl n"><b>${g.semana.length}</b><span>esta semana</span></button></div>`;
  h+=`<div class="card"><h2>Compromissos de hoje</h2>`+(deHoje.length? deHoje.map(e=>agBlocoEvento(e,false)).join('') : `<div class="vazio">Nenhum compromisso marcado para hoje.</div>`)+`</div>`;
  const fazer=g.atrasadas.concat(g.hoje);
  h+=`<div class="card"><h2>Fazer hoje</h2>`+(fazer.length? fazer.slice(0,5).map(agLinhaTarefa).join('') + (fazer.length>5?`<button class="big ghost" data-ini="tarefas">Ver as outras ${fazer.length-5} →</button>`:'')
      : `<div class="vazio ok">✓ Nada atrasado e nada vencendo hoje.</div>`)+`</div>`;
  if(prox.length) h+=`<div class="card"><h2>Próximos 7 dias</h2>`+prox.map(e=>agLinhaCurta(e)).join('')+`</div>`;

function agEmpresa(ev){ const lim=new Date(Date.now()+14*864e5).toISOString().slice(0,10);

  document.addEventListener('pointerdown',()=>{ if(!history.state || history.state.t==='base'){ try{ history.pushState({t:'app'},''); }catch(e){} } },true);
  if('serviceWorker' in navigator){ const tinha=!!navigator.serviceWorker.controller; navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!tinha) return; const b=document.createElement('button'); b.textContent='Versão nova do app — toque para atualizar (nada se perde)'; b.style.cssText='position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:9998;background:#19A878;color:#fff;border:0;border-radius:12px;padding:14px;font:700 15px system-ui;box-shadow:0 4px 16px rgba(0,0,0,.25)'; b.onclick=()=>location.reload(); document.body.appendChild(b); }); }
  prepararFonteCarimbo(); // baixa a fonte do carimbo agora (com internet) para o SW guardar
  // pede ao celular para NÃO apagar os dados do app quando faltar espaço (fila, fichas, rascunhos)
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  if(navigator.onLine){ baixarPacote(true); enviarFila(); }
  // pacote de demonstração local (quando abre pelo repositório sem robô configurado)
  if(!S.pacote){ try{ const r=await fetch('campo.json'); if(r.ok){ S.pacote=await r.json(); LS.set('pacote',S.pacote); render(); } }catch(e){} }
})();
</script>
