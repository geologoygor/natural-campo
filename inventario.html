<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#113E6B">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Inventário · Natural Engenharia</title>
<style>
:root{
  --navy:#113E6B; --navy-2:#0C2F52; --green:#19A878; --green-2:#137F5B;
  --ink:#1B2430; --muted:#5B6570; --line:#D9DEE5; --bg:#F3F5F8; --card:#FFFFFF; --soft:#F6F8FB;
  --warn:#8A4B00; --warn-bg:#FEF3C7; --err:#B91C1C; --err-bg:#FEE2E2; --ok:#137F5B; --ok-bg:#DCFCE7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --ink:#E8EEF5; --muted:#9FB2C7; --line:#2B415C; --bg:#0B1524; --card:#101F33; --soft:#16283F;
  --warn:#F2C879; --warn-bg:#2D2310; --err:#F08268; --err-bg:#2C1A15; --ok:#4CC79E; --ok-bg:#123028; color-scheme:dark;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{height:26px;display:block}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){header img{height:22px}header button{padding:6px 8px;font-size:12px}}
header .t small{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
main{padding:14px 16px calc(100px + var(--sab));max-width:720px;margin:0 auto;display:grid;gap:13px}
h2.tit{margin:2px 0 0;font-size:18px;color:var(--navy)}
@media (prefers-color-scheme:dark){h2.tit{color:#8DB8E6}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;display:grid;gap:12px}
.sec>h3{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-2)}
@media (prefers-color-scheme:dark){.sec>h3{color:var(--green)}}
.dica{margin:0;font-size:13px;color:var(--muted)}
.campo{display:grid;gap:6px}
.campo>label,.campo>.lb{font-size:14px;font-weight:600}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.un{display:flex;gap:8px;align-items:center}.un input{flex:1}.un span{font-size:14px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.g2{grid-template-columns:1fr}}
.ops{display:flex;flex-wrap:wrap;gap:7px}
.ops button{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:20px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer;min-height:42px}
.ops button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ops.chk button.on::before{content:"✓ "}
.btn{background:var(--green);color:#fff;border:0;border-radius:11px;padding:13px 18px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:0;color:var(--navy);font:inherit;text-decoration:underline;cursor:pointer}
@media (prefers-color-scheme:dark){.link{color:#8DB8E6}}
.aviso{border-left:4px solid #D97706;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:11px 13px;font-size:14px}
.aviso.neg{border-left-color:var(--err);background:var(--err-bg);color:var(--err)}
.aviso.ok{border-left-color:var(--green);background:var(--ok-bg);color:var(--ok)}
.lista{display:grid;gap:8px}
.bem{display:grid;gap:4px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-left:4px solid var(--line);border-radius:11px;padding:11px 13px;font:inherit;cursor:pointer}
.bem.pend{border-left-color:#D97706}.bem.ok{border-left-color:var(--green)}
.bem b{font-size:15px}.bem small{font-size:13px;color:var(--muted)}
.faltas{display:flex;flex-wrap:wrap;gap:4px}
.faltas i{font-style:normal;font-size:12px;padding:2px 8px;border-radius:12px;background:var(--err-bg);color:var(--err)}
.faltas i.ok{background:var(--ok-bg);color:var(--ok)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--warn-bg);color:var(--warn);vertical-align:2px}
.acoes{display:flex;gap:7px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tile{display:grid;gap:3px;text-align:left;background:var(--soft);color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:12px;font:inherit;cursor:pointer;min-height:66px}
.tile b{font-size:15px}.tile small{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px dashed var(--line);background:none;color:var(--muted);border-radius:16px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.acess{display:grid;gap:6px}
.acl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 9px;border:1px solid var(--line);border-radius:10px}
.acl .nm{font-size:15px}.sw{display:flex;gap:5px}
.sw button{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;cursor:pointer;min-width:52px}
.sw button.on.s{background:var(--green);border-color:var(--green);color:#fff}.sw button.on.n{background:var(--err);border-color:var(--err);color:#fff}
.ex{grid-column:1/-1;display:grid;grid-template-columns:90px 1fr;gap:6px}
.ex input{font:inherit;font-size:16px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);min-width:0}
.itens{display:grid;gap:8px}
.it{border:1px solid var(--line);border-radius:10px;padding:9px;display:grid;gap:7px}
.it .l1{display:flex;gap:8px;align-items:center}
.it input{font:inherit;font-size:16px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);min-width:0;width:100%}
.it .l1 input{font-weight:600}
.it .l2{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px}.it .l2 label{font-size:11.5px;color:var(--muted);display:grid;gap:3px}
.it .x{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}
.tot{font-size:14px;color:var(--muted)}.tot b{color:var(--ink)}
.slot{border:1.5px dashed var(--line);border-radius:11px;padding:10px;display:grid;gap:8px}
.slot .tt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.slot .tt b{flex:1;min-width:140px;font-size:15px}
.req{color:var(--err)}
.bt{border:1.5px solid var(--line);background:var(--soft);border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer}
.bt input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs figure{position:relative;margin:0;width:84px;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .pdf{display:grid;place-items:center;width:100%;height:100%;font-weight:700;background:var(--soft);color:var(--muted)}
.thumbs button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.62);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer}
#pe{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--sab));display:flex;gap:9px;justify-content:center}
#pe[hidden]{display:none}
#pe .btn{flex:1;max-width:340px}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%) translateY(20px);background:#0F2440;color:#fff;padding:11px 16px;border-radius:11px;font-size:14px;max-width:calc(100% - 32px);opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
  <img src="logo-white.png" alt="Natural Engenharia">
  <div class="t"><b>Inventário de patrimônio</b><small id="quem"></small></div>
  <button type="button" id="h-inicio">Início</button>
  <button type="button" id="h-ajustes" aria-label="Ajustes">Ajustes</button>
</header>
<main id="main"></main>
<div id="pe" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

   Tudo o que sai daqui entra no Patrimônio marcado "a validar" e só vale depois que
   o Ygor valida. Fotos e documentos sobem para a pasta do bem no Drive.

   se:{k,v} (só aparece se outro campo tiver valor v), dica}.

    {k:"titularNome", l:"Nome do titular no documento", t:"tx", se:{k:"titular",v:"*outro"}},

var INV_VEIC_VENC = [

  {k:"seguro", l:"Seguro — fim da vigência", orgao:"SEGURADORA"},

  {k:"apolice", l:"Apólice do seguro"},
  {k:"nf", l:"Nota fiscal ou contrato de compra"}
];
var INV_VEIC_FOTOS = ["Frente","Traseira com a placa","Lateral","Painel com o hodômetro","Número do chassi","Avarias (se houver)"];

var INV_TIPOS = [
 {id:"gnss", rot:"GNSS RTK", sub:"base, rover e acessórios", cat:"equipamento", centro:"TOPOGRAFIA",

 {id:"impressora", rot:"Impressora", sub:"jato, tanque ou laser", cat:"ti", centro:"ESCRITORIO",

 {id:"spt", rot:"Equipamento SPT", sub:"sondagem à percussão", cat:"maquina", centro:"SONDAGENS",

/* ---------- IndexedDB: rascunhos e fila de envio ---------- */
var idbP=null;
function idb(){
  if(idbP) return idbP;
  idbP=new Promise(function(res){
    try{ var rq=indexedDB.open("natural-inventario",1);
      rq.onupgradeneeded=function(){ var db=rq.result; db.createObjectStore("rasc",{keyPath:"id"}); db.createObjectStore("fila",{keyPath:"id"}); };
      rq.onsuccess=function(){ res(rq.result); }; rq.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
  return idbP;
}
function op(store,modo,fn){
  return idb().then(function(db){ if(!db) return null;
    return new Promise(function(res){ try{ var tx=db.transaction(store,modo), r=fn(tx.objectStore(store));
      tx.oncomplete=function(){ res(r&&r.result!==undefined?r.result:null); }; tx.onerror=function(){ res(null); }; }catch(e){ res(null); } }); });
}
function rascSalvar(){
  if(!S.d) return Promise.resolve();
  if(!S.rascId) S.rascId=uid("RI");
  return op("rasc","readwrite",function(st){ return st.put({id:S.rascId,tipo:S.tipo,bemId:S.bemId,d:S.d,em:new Date().toISOString(),
    fotos:S.fotos.map(function(f){ return {slot:f.slot,blob:f.blob,tipo:f.tipo}; }),
    docs:S.docs.map(function(f){ return {k:f.k,l:f.l,blob:f.blob,tipo:f.tipo}; })}); });
}
function rascLista(){ return op("rasc","readonly",function(st){ return st.getAll(); }).then(function(r){ return r||[]; }); }
function rascApagar(id){ return op("rasc","readwrite",function(st){ return st.delete(id); }); }
function filaLista(){ return op("fila","readonly",function(st){ return st.getAll(); }).then(function(r){ return r||[]; }); }
function filaPut(it){ return op("fila","readwrite",function(st){ return st.put(it); }); }

/* ---------- imagem ---------- */
function reduzir(file){
  return new Promise(function(res){
    if(!/^image\//.test(file.type)){ res(file); return; }
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){ var M=1800, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,M/Math.max(w,h));
      var cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(function(b){ res(b||file); },"image/jpeg",0.82); };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function b64(blob){ return new Promise(function(ok,er){ var r=new FileReader(); r.onload=function(){ ok(String(r.result).split(",")[1]); }; r.onerror=er; r.readAsDataURL(blob); }); }

      if(!silencioso) toast("O robô respondeu sem a lista: "+(j&&j.erro||"?")); return false;
    }).catch(function(e){ if(!silencioso) toast("Sem internet agora — usando a lista guardada no aparelho."); return false; });
}
function bensLista(){ return (S.pacote&&S.pacote.patrimonio)||[]; }
function proxPatrimonio(){
  var mx=0, base=S.pacote&&S.pacote.patrimonioProx; var m0=/^NE-(\d+)/i.exec(base||""); if(m0) mx=+m0[1]-1;
  bensLista().forEach(function(b){ var m=/^NE-(\d+)/i.exec(b.patrimonio||""); if(m) mx=Math.max(mx,+m[1]); });
  (LS.get("usados",[])||[]).forEach(function(p){ var m=/^NE-(\d+)/i.exec(p||""); if(m) mx=Math.max(mx,+m[1]); });
  return "NE-"+String(mx+1).padStart(4,"0");
}

    (bens.length?'<div class="lista">'+bens.map(function(b){ var f=b.faltas||[];

  h+='<section class="sec"><h3>Talvez esquecidos</h3><p class="dica">Coisas que costumam ficar de fora. Se a empresa tiver, toque e cadastre.</p><div class="chips">'+

    box.innerHTML='<section class="sec"><h3>Fichas começadas neste aparelho ('+L.length+')</h3>'+
      L.sort(function(a,b){ return String(b.em).localeCompare(String(a.em)); }).map(function(r){
        return '<div class="bem pend"><b>'+esc((r.d&&r.d.c&&r.d.c.nome)||tipoDe(r.tipo).rot)+'</b><small>'+(r.fotos||[]).length+' foto(s) · '+brData(r.em)+'</small>'+
          '<span class="acoes"><button type="button" class="btn sm" data-rasc="'+esc(r.id)+'">Continuar</button>'+
          '<button type="button" class="btn sm ghost" data-rascdel="'+esc(r.id)+'">Descartar</button></span></div>'; }).join("")+'</section>';

}
function pintarFila(){
  filaLista().then(function(L){ S.fila=L; var box=$("#filabox"); if(!box) return;
    var pend=L.filter(function(x){ return x.status!=="enviado"; }), erro=pend.filter(function(x){ return x.status==="erro"; });

/* ---------- ficha ---------- */
function novaFicha(tipoId, bemId, nomeSug){
  var t=tipoDe(tipoId), b=bemId?bensLista().find(function(x){ return x.id===bemId; }):null;
  S.tipo=t.id; S.bemId=bemId||null; S.rascId=null; S.fotos=[]; S.docs=[];
  var c={ nome:b?b.nome:(nomeSug||t.rot), marca:(b&&b.marca)||t.marca||"", modelo:(b&&b.modelo)||t.modelo||"",
    serie:(b&&b.serie)||"", patrimonio:(b&&b.patrimonio)||proxPatrimonio(), local:(b&&b.local)||"",
    centro:(b&&b.centro)||t.centro||"", situacao:"ativo" };
  if(t.veic&&b&&b.serie&&/^[A-Z]{3}-?\d[A-Z0-9]\d{2}$/i.test(b.serie)){ c.placa=b.serie.toUpperCase(); c.temPlaca="Sim"; }
  S.d={c:c, acess:{}, itens:itensPadrao(t), venc:{}, obs:""};
  ir("ficha");
}
function itensPadrao(t){ var L=[]; (t.secoes||[]).forEach(function(s){ (s.itens||[]).forEach(function(it){ L.push({i:it.i,q:"",c:"",d:"",est:"",m:!!it.m,dz:!!it.d}); }); }); return L; }
function campoHtml(f){
  if(!condOk(f.se)) return "";
  var v=val(f.k), id="c-"+f.k, h='<div class="campo">';
  if(f.t==="r"||f.t==="c"){
    h+='<span class="lb">'+esc(f.l)+'</span><div class="ops'+(f.t==="c"?" chk":"")+'" data-ops="'+f.k+'" data-multi="'+(f.t==="c"?1:0)+'">'+
      f.op.map(function(o){ var on=f.t==="c"?(Array.isArray(v)&&v.indexOf(o)>=0):v===o;
        return '<button type="button" class="'+(on?"on":"")+'" data-v="'+esc(o)+'">'+esc(o)+'</button>'; }).join("")+'</div>';
  } else if(f.t==="sel"){
    h+='<label for="'+id+'">'+esc(f.l)+'</label><select id="'+id+'" data-k="'+f.k+'">'+
      f.op.map(function(o){ return '<option value="'+esc(o[0])+'"'+(v===o[0]?" selected":"")+'>'+esc(o[1])+'</option>'; }).join("")+'</select>';
  } else if(f.t==="ta"){
    h+='<label for="'+id+'">'+esc(f.l)+'</label><textarea id="'+id+'" data-k="'+f.k+'">'+esc(v||"")+'</textarea>';
  } else {
    var tp=f.t==="d"?"date":"text", mod=f.t==="n"?"decimal":(f.mod||"text");
    var inp='<input type="'+tp+'" id="'+id+'" data-k="'+f.k+'"'+(f.up?' data-up="1" autocapitalize="characters"':'')+' inputmode="'+mod+'" value="'+esc(v||"")+'">';
    h+='<label for="'+id+'">'+esc(f.l)+'</label>'+(f.u?'<div class="un">'+inp+'<span>'+esc(f.u)+'</span></div>':inp);
  }
  if(f.dica) h+='<p class="dica">'+esc(f.dica)+'</p>';
  return h+'</div>';
}
function acessHtml(lista){
  var A=S.d.acess, todos=lista.concat(Object.keys(A).filter(function(k){ return lista.indexOf(k)<0; }));
  return '<div class="acess">'+todos.map(function(nm){ var a=A[nm]||{}, k=esc(nm);
    return '<div class="acl"><span class="nm">'+esc(nm)+'</span><span class="sw">'+
      '<button type="button" class="s'+(a.tem==="s"?" on":"")+'" data-ac="'+k+'" data-v="s">Tem</button>'+
      '<button type="button" class="n'+(a.tem==="n"?" on":"")+'" data-ac="'+k+'" data-v="n">Não</button></span>'+
      (a.tem==="s"?'<span class="ex"><input inputmode="numeric" placeholder="qtd" data-acq="'+k+'" value="'+esc(a.q||"")+'"><input placeholder="nº de série / obs." data-aco="'+k+'" value="'+esc(a.o||"")+'"></span>':'')+'</div>';
  }).join("")+'<button type="button" class="btn sm ghost" data-acnovo="1">+ outro acessório</button></div>';
}
function metros(it){ return Math.round(num(it.q)*num(it.c)*100)/100; }

  return '<div class="itens">'+S.d.itens.map(function(it,ix){ var tot=it.m&&metros(it);
    return '<div class="it"><div class="l1"><input class="nm" data-it="'+ix+'" data-f="i" value="'+esc(it.i)+'" placeholder="peça"><button type="button" class="x" data-itdel="'+ix+'" aria-label="Tirar linha">×</button></div>'+
      '<div class="l2"><label>Quantidade<input inputmode="numeric" data-it="'+ix+'" data-f="q" value="'+esc(it.q||"")+'"></label>'+

function totMetros(){ var el=$("#totm"); if(!el) return;

    '</div><div class="thumbs">'+fs.map(function(f){ var ix=lista.indexOf(f);

    campoHtml({k:"defeito2",l:"Por que não funciona?",t:"ta",se:{k:"funciona",v:"Não"}})+'</section>';
  var equipe=((S.pacote&&S.pacote.equipe)||[]);
  h+='<section class="sec"><h3>Onde está e com quem</h3>'+

function avisos(){
  var t=tipoDe(S.tipo), c=S.d.c, L=[];
  if(!String(c.nome||"").trim()) L.push("dê um nome ao bem");
  if(!c.serie&&!(t.veic&&c.placa)) L.push("sem nº de série — fotografe a etiqueta se não conseguir ler");
  if(!S.fotos.length) L.push("nenhuma foto");
  if(t.veic&&!c.temPlaca) L.push("diga se o veículo tem placa");
  if(t.veic&&c.temPlaca==="Sim"&&!c.placa) L.push("falta a placa");
  if(t.veic&&c.temPlaca==="Sim"&&!S.docs.some(function(d){ return d.k==="crlv"; })&&!(Array.isArray(c.crlvDepois)&&c.crlvDepois.length)) L.push("veículo com placa precisa do CRLV (ou marque que manda depois)");
  if(t.veic&&c.temPlaca==="Sim"&&!S.d.venc.licenc) L.push("falta a validade do licenciamento (está no CRLV)");
  return L;
}
function bloqueios(){
  var t=tipoDe(S.tipo), c=S.d.c, L=[];
  if(!String(c.nome||"").trim()) L.push("Dê um nome ao bem.");
  if(t.veic&&!c.temPlaca) L.push("Diga se o veículo tem placa.");
  if(t.veic&&c.temPlaca==="Sim"&&!S.docs.some(function(d){ return d.k==="crlv"; })&&!(Array.isArray(c.crlvDepois)&&c.crlvDepois.length)) L.push("Veículo com placa: anexe o CRLV ou marque que manda depois.");
  return L;
}
function pintarFaltam(){ var el=$("#faltam"); if(!el) return; var L=avisos();
  el.innerHTML=L.length?'<div class="aviso"><b>Antes de enviar, confira:</b><br>'+L.map(function(x){ return "• "+esc(x); }).join("<br>")+'</div>':''; }

var tmr=null; function salvarLogo(){ clearTimeout(tmr); tmr=setTimeout(rascSalvar,900); }
function repintar(){ var y=window.scrollY; render(); window.scrollTo(0,y); }
document.addEventListener("input",function(ev){ var el=ev.target; if(S.tela!=="ficha"||!S.d) return;
  if(el.dataset.k){ var v=el.value; if(el.dataset.up) v=v.toUpperCase(); S.d.c[el.dataset.k]=v; pintarFaltam(); salvarLogo(); return; }
  if(el.dataset.venc){ S.d.venc[el.dataset.venc]=el.value; pintarFaltam(); salvarLogo(); return; }
  if(el.dataset.obs){ S.d.obs=el.value; salvarLogo(); return; }
  if(el.dataset.acq!==undefined){ (S.d.acess[el.dataset.acq]=S.d.acess[el.dataset.acq]||{}).q=el.value; salvarLogo(); return; }
  if(el.dataset.aco!==undefined){ (S.d.acess[el.dataset.aco]=S.d.acess[el.dataset.aco]||{}).o=el.value; salvarLogo(); return; }
  if(el.dataset.it!==undefined){ var it=S.d.itens[+el.dataset.it]; if(!it) return; it[el.dataset.f]=el.value;
    var tt=document.querySelector('[data-tot="'+el.dataset.it+'"]'); if(tt&&it.m){ var tot=metros(it); tt.innerHTML='Total: <b>'+(tot?String(tot).replace(".",","):"—")+' m</b>'; }
    totMetros(); salvarLogo(); }
});
document.addEventListener("change",function(ev){ var el=ev.target; if(S.tela!=="ficha"||!S.d) return;
  if(el.id==="c-tipo"){ S.tipo=el.value; var t=tipoDe(el.value); S.d.itens=itensPadrao(t); if(!S.d.c.centro) S.d.c.centro=t.centro; repintar(); return; }
  if(el.dataset.k&&el.tagName==="SELECT"){ S.d.c[el.dataset.k]=el.value; salvarLogo(); return; }
  if(el.dataset.foto!==undefined||el.dataset.doc!==undefined){
    var ehFoto=el.dataset.foto!==undefined, slot=ehFoto?el.dataset.foto:el.dataset.doc, files=[].slice.call(el.files||[]); el.value="";
    Promise.all(files.map(function(f){ return reduzir(f).then(function(b){ return {slot:slot,k:slot,blob:b,tipo:b.type||f.type||"image/jpeg",url:URL.createObjectURL(b)}; }); }))
    .then(function(L){ L.forEach(function(x){ if(ehFoto) S.fotos.push(x); else { x.l=((tipoDe(S.tipo).docs||[]).find(function(q){ return q.k===slot; })||{l:"Outro documento"}).l; S.docs.push(x); } });
      rascSalvar(); repintar(); });
  }
});
document.addEventListener("click",function(ev){
  var b=ev.target.closest("button"); if(!b) return; var ds=b.dataset;
  if(b.id==="h-ajustes"){ ir("ajustes"); return; }
  if(b.id==="h-inicio"){ if(S.tela==="ficha") rascSalvar(); S.tela="inicio"; render(); return; }
  if(ds.bem){ var bem=bensLista().find(function(x){ return x.id===ds.bem; }); novaFicha(tipoDoBem(bem), ds.bem); return; }
  if(ds.novo){ novaFicha(ds.novo); return; }
  if(ds.esq!==undefined){ var e=INV_ESQUECIDOS[+ds.esq]; novaFicha(e[0],null,e[1]); return; }
  if(ds.rasc){ rascLista().then(function(L){ var r=L.find(function(x){ return x.id===ds.rasc; }); if(!r) return;
      S.tipo=r.tipo; S.bemId=r.bemId; S.rascId=r.id; S.d=r.d;
      S.fotos=(r.fotos||[]).map(function(f){ return {slot:f.slot,k:f.slot,blob:f.blob,tipo:f.tipo}; });
      S.docs=(r.docs||[]).map(function(f){ return {slot:f.k,k:f.k,l:f.l,blob:f.blob,tipo:f.tipo}; });
      ir("ficha"); }); return; }
  if(ds.rascdel){ if(!window.confirm("Descartar esta ficha começada? As fotos dela se perdem.")) return; rascApagar(ds.rascdel).then(render); return; }
  if(S.tela!=="ficha"||!S.d) return;
  var ops=b.closest("[data-ops]");
  if(ops){ var k=ops.dataset.ops, v=ds.v;
    if(ops.dataset.multi==="1"){ var arr=Array.isArray(S.d.c[k])?S.d.c[k].slice():[]; var i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); S.d.c[k]=arr; }
    else S.d.c[k]=(S.d.c[k]===v?"":v);
    salvarLogo(); repintar(); return; }
  if(ds.ac!==undefined){ var a=S.d.acess[ds.ac]=S.d.acess[ds.ac]||{}; a.tem=(a.tem===ds.v?"":ds.v); salvarLogo(); repintar(); return; }
  if(ds.acnovo){ var nm=(window.prompt("Nome do acessório")||"").trim(); if(!nm) return; S.d.acess[nm]={tem:"s"}; salvarLogo(); repintar(); return; }
  if(ds.itnovo!==undefined){ S.d.itens.push({i:"",q:"",c:"",d:"",est:"",m:ds.itnovo==="1"}); salvarLogo(); repintar(); return; }
  if(ds.itdel!==undefined){ S.d.itens.splice(+ds.itdel,1); salvarLogo(); repintar(); return; }
  if(ds.tirar){ (ds.tirar[0]==="f"?S.fotos:S.docs).splice(+ds.tirar.slice(1),1); rascSalvar(); repintar(); return; }
  if(ds.guardar){ rascSalvar().then(function(){ toast("Guardado neste aparelho. Continue quando quiser, mesmo sem internet."); S.tela="inicio"; render(); }); return; }
  if(ds.enviar){ enviar(); return; }
});

/* ---------- enviar: vira itens da fila; a ficha em JSON vai por último ---------- */
function montar(fichaId){
  var t=tipoDe(S.tipo), c=S.d.c, cat=t.id==="outro"?(c.catLivre||"equipamento"):t.cat;
  var serie=c.serie||""; if(t.veic&&c.placa&&!serie) serie=c.placa;
  var acess={}; Object.keys(S.d.acess).forEach(function(k){ var a=S.d.acess[k]; if(a&&a.tem) acess[k]={tem:a.tem,q:a.q||"",o:a.o||""}; });
  var itens=S.d.itens.filter(function(it){ return it.i&&(it.q||it.c||it.d||it.est); }).map(function(it){
    var o={i:it.i,q:it.q||"",d:it.d||"",est:it.est||""}; if(it.m){ o.c=it.c||""; o.m=true; o.metros=metros(it); } return o; });
  return {app:"inventario", versao:VERSAO, fichaId:fichaId, bemId:S.bemId||"", tipo:t.id, tipoRot:t.rot, quem:S.quem, em:new Date().toISOString(),
    proposto:{nome:String(c.nome||"").trim(), categoria:cat, marca:(c.marca||"").trim(), modelo:(c.modelo||"").trim(), serie:serie.trim(),
      patrimonio:(c.patrimonio||"").trim(), aquisicao:c.aquisicao||"", valor:Math.round(num(c.valor)*100)/100, situacao:c.situacao||"ativo",
      centro:c.centro||t.centro||"", responsavelId:c.resp||"", local:(c.local||"").trim()},
    c:c, acess:acess, itens:itens, venc:S.d.venc, obs:S.d.obs||"",
    fipe:(t.veic&&c.temPlaca==="Sim")?{pedir:true, versao:c.fipeVersao||"", codigo:c.fipeCodigo||"", anoModelo:c.anoMod||"", combustivel:c.comb||""}:null,
    arquivos:[]};
}
function enviar(){
  var bl=bloqueios(); if(bl.length){ toast(bl.join(" "),5200); pintarFaltam(); return; }
  var fichaId=uid("FI"), ficha=montar(fichaId), p=ficha.proposto;
  var pasta=("PATRIMONIO - "+(p.patrimonio||"SEM NUMERO")+" - "+limparNome(p.nome).toUpperCase()).slice(0,70)+" ("+fichaId.slice(-6)+")";
  var pref=arq(p.patrimonio||"BEM"), dia=hojeBV(), hr=horaBV(), itens=[];
  S.fotos.forEach(function(f,i){ var nome=dia+"_"+hr+"_"+pref+"_foto_"+arq(f.slot)+"_"+(i+1)+".jpg";
    ficha.arquivos.push({nome:nome,papel:"foto",slot:f.slot});
    itens.push({blob:f.blob,mime:f.tipo||"image/jpeg",nome:nome,papel:"foto",slot:f.slot}); });
  S.docs.forEach(function(d,i){ var ext=d.tipo==="application/pdf"?".pdf":".jpg", nome=dia+"_"+hr+"_"+pref+"_doc_"+arq(d.k==="outro"?"documento":d.k)+"_"+(i+1)+ext;
    ficha.arquivos.push({nome:nome,papel:"doc",k:d.k,l:d.l});
    itens.push({blob:d.blob,mime:d.tipo||"image/jpeg",nome:nome,papel:"doc",slot:d.k}); });
  var nomeFicha=dia+"_"+hr+"_"+pref+"_ficha_inventario.json";
  itens.push({blob:new Blob([JSON.stringify(ficha,null,1)],{type:"application/json"}),mime:"application/json",nome:nomeFicha,papel:"ficha",slot:"ficha"});
  var agora=new Date().toISOString();
  var regs=itens.map(function(it,i){ return {id:fichaId+"-"+String(i).padStart(3,"0"), fichaId:fichaId, bemNome:p.nome, obraId:"PATRIMONIO", obraNome:pasta,
    tipo:"inventario", slot:it.slot, slotTitulo:it.papel, nome:it.nome, mime:it.mime, blob:it.blob, papel:it.papel, status:"pendente", criadoEm:agora,
    meta:{app:"inventario", fichaId:fichaId, papel:it.papel, bemId:S.bemId||"", patrimonio:p.patrimonio, bem:p.nome, ultimo:it.papel==="ficha"}}; });
  Promise.all(regs.map(filaPut)).then(function(){
    var us=LS.get("usados",[]); if(p.patrimonio&&us.indexOf(p.patrimonio)<0){ us.push(p.patrimonio); LS.set("usados",us); }
    return S.rascId?rascApagar(S.rascId):null;
  }).then(function(){
    S.d=null; S.rascId=null; S.fotos=[]; S.docs=[]; S.tela="inicio"; render(); window.scrollTo(0,0);
    toast(navigator.onLine?"Ficha na fila de envio. Subindo…":"Sem internet: a ficha ficou no aparelho e sobe quando o sinal voltar.",4200);
    enviarFila(false);
  });
}
function enviarFila(manual){
  if(S.enviando) return; if(!navigator.onLine){ if(manual) toast("Sem internet agora."); pintarFila(); return; }
  S.enviando=true; pintarFila();
  filaLista().then(function(L){
    var pend=L.filter(function(x){ return x.status!=="enviado"; }).sort(function(a,b){ return a.id.localeCompare(b.id); });
    var p=Promise.resolve(), parar=false;
    pend.forEach(function(it){ p=p.then(function(){ if(parar) return;
      return b64(it.blob).then(function(b){
        var corpo={token:S.cfg.token, acao:"enviar", id:it.id, obraId:it.obraId, obraNome:it.obraNome, quem:S.quem, tipo:it.tipo, slot:it.slot, slotTitulo:it.slotTitulo,
          nome:it.nome, mime:it.mime, meta:it.meta, criadoEm:it.criadoEm, b64:b};
        return fetch(S.cfg.script,{method:"POST",body:JSON.stringify(corpo)}).then(function(r){ return r.json().catch(function(){ return {ok:false,erro:"resposta inválida"}; }); });
      }).then(function(j){
        if(j.ok){ it.status="enviado"; it.enviadoEm=new Date().toISOString(); it.url=j.url||""; it.blob=null; it.erro=null; }
        else { it.status="erro"; it.erro=j.erro||"erro"; parar=true; }
        return filaPut(it);
      }).catch(function(e){ it.status="pendente"; it.erro=null; parar=true; return filaPut(it); })
        .then(pintarFila);
    }); });
    return p;
  }).then(function(){ S.enviando=false; pintarFila(); });
}
window.addEventListener("online",function(){ enviarFila(false); });

/* ---------- início ---------- */
(function(){
  S.cfg=LS.get("cfg",null)||CFG_PADRAO; S.quem=LS.get("quem",""); S.pacote=LS.get("pacote",null);
  render();
  var qb=null; try{ qb=new URLSearchParams(location.search).get("bem"); }catch(e){}
  function abrirQb(){ if(!qb||!S.quem) return; var bem=bensLista().find(function(x){ return x.id===qb; }); if(bem){ qb=null; novaFicha(tipoDoBem(bem), bem.id); } }
  abrirQb();
  baixarPacote(true).then(function(){ abrirQb(); enviarFila(false); });
  setInterval(function(){ enviarFila(false); }, 60000);
  if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
})();

</script>
